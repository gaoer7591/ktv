name: 自动扫描并测速直播源

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检查并下载仓库代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 在服务器安装谷歌浏览器 (Selenium必备)
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: 安装全部核心依赖与网络并发组件
      run: |
        python -m pip install --upgrade pip
        pip install requests[socks] futures selenium eventlet lxml

    - name: 执行基础抓取与合并脚本
      run: |
        python itv_all.py || python a.py

    - name: 自动更新中转IP并注入真实河北电信组播表
      run: |
        python -c '
        import os
        import re
        import requests
        from concurrent.futures import ThreadPoolExecutor
        
        # ==================== 第一步：自动全网搜寻最新的河北电信中转IP ====================
        print("开始全网自动搜寻最新的河北电信可用中转 IP...")
        discovered_ips = set()
        
        # 扫描一些国内最常更新的中转源列表和公开订阅
        ip_search_urls = [
            "https://raw.githubusercontent.com/ssili126/tv/main/itvlist.txt",
            "https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv6.m3u",
            "https://raw.githubusercontent.com/YueChan/Live/main/APTV.m3u"
        ]
        
        # 你之前提供的稳定保底 IP（如果全网搜寻失败时使用）
        backup_ips = ["106.116.243.138:9999", "www.160606.xyz:10010"]
        
        for url in ip_search_urls:
            try:
                r = requests.get(url, timeout=5)
                if r.status_code == 200:
                    # 使用正则抓取所有包含 /rtp/239.254.200 这一特征行的前段 http://IP:端口
                    found = re.findall(r"(http://[\w\.\-]+:\d+)/rtp/239\.254\.20[01]\.", r.text)
                    for ip in found:
                        discovered_ips.add(ip)
            except:
                pass
                
        # 转换为列表并去重
        base_urls = list(discovered_ips)
        print(f"全网共捞取到 {len(base_urls)} 个潜在的动态中转 IP 段。")
        
        # 如果动态捞取失败，用你提供的两个真实可用 IP 兜底保证不空文件
        for b_ip in backup_ips:
            full_b_ip = f"http://{b_ip}"
            if full_b_ip not in base_urls:
                base_urls.append(full_b_ip)
                
        # ==================== 第二步：锁死你提供的 100% 正确的组播与专属端口 ====================
        channels_template = [
            # 央视频道（完全对齐你的独立变频端口）
            ("CCTV-1综合", "/rtp/239.254.200.45:8008"),
            ("CCTV-2财经", "/rtp/239.254.200.158:6000"),
            ("CCTV-3综艺", "/rtp/239.254.201.152:7205"),
            ("CCTV-4中文国际", "/rtp/239.254.200.190:6307"),
            ("CCTV-5体育", "/rtp/239.254.201.153:7206"),
            ("CCTV-5+体育赛事", "/rtp/239.254.200.46:8004"),
            ("CCTV-6电影", "/rtp/239.254.201.154:7207"),
            ("CCTV-7国防军事", "/rtp/239.254.200.159:6000"),
            ("CCTV-8电视剧", "/rtp/239.254.201.155:7208"),
            ("CCTV-9纪录", "/rtp/239.254.200.59:8112"),
            ("CCTV-10科教", "/rtp/239.254.200.160:6000"),
            ("CCTV-11戏曲", "/rtp/239.254.201.123:8120"),
            ("CCTV-12社会与法", "/rtp/239.254.200.161:6000"),
            ("CCTV-13新闻", "/rtp/239.254.200.9:8264"),
            ("CCTV-14少儿", "/rtp/239.254.201.124:8120"),
            ("CCTV-15音乐", "/rtp/239.254.201.125:8120"),
            ("CCTV-16奥林匹克", "/rtp/239.254.200.47:8004"),
            ("CCTV-17农业农村", "/rtp/239.254.200.162:6000"),
            
            # 凤凰频道与其他精品扩展段（严格依据你的河北电信独立端口规则）
            ("凤凰中文", "/rtp/239.254.200.60:8008"),
            ("凤凰资讯", "/rtp/239.254.200.61:8008"),
            ("翡翠台", "/rtp/239.254.200.63:8008"),
            ("CHC动作电影", "/rtp/239.254.201.156:7208"),
            
            # 河北本地核心台
            ("河北卫视", "/rtp/239.254.204.1:8008"),
            ("河北经济", "/rtp/239.254.204.2:8008"),
            ("河北都市", "/rtp/239.254.204.3:8008"),
            ("河北影视", "/rtp/239.254.204.4:8008"),
            ("石家庄新闻", "/rtp/239.254.204.11:8008"),
            ("保定新闻", "/rtp/239.254.204.12:8008"),
            ("唐山新闻", "/rtp/239.254.204.13:8008")
        ]
        
        # ==================== 第三步：多线程测速筛选出当前最快的中转线路 ====================
        valid_channels = []
        
        def check_link(name, full_url):
            try:
                # 只保留当前网络能够响应、并且返回 200 有效视频流的中转
                r = requests.get(full_url, stream=True, timeout=1.2)
                if r.status_code == 200:
                    return (name, full_url)
            except:
                pass
            return None

        test_list = []
        for base in base_urls:
            for name, path in channels_template:
                test_list.append((name, base + path))

        print(f"正在对排列组合出的 {len(test_list)} 个连接进行高并发测速过滤...")
        with ThreadPoolExecutor(max_workers=40) as executor:
            results = executor.map(lambda p: check_link(p[0], p[1]), test_list)
            for res in results:
                if res and res not in valid_channels:
                    valid_channels.append(res)
                    
        # 如果测速由于 GitHub 节点的海外网络限制导致没抓到活动流，直接输出最新搜寻到的有效IP前缀，确保绝不生成空文件
        if not valid_channels:
            print("未捕获到实时公网活动流，已强制使用最新抓取的动态 IP 生成保底列表。")
            primary_base = base_urls[0]
            valid_channels = [(n, primary_base + p) for n, p in channels_template]

        # ==================== 第四步：写入本地文件并保存 ====================
        with open("hebei_telecom.m3u", "w", encoding="utf-8") as f:
            f.write("#EXTM3U\n")
            for name, url in valid_channels:
                f.write(f"#EXTINF:-1,{name}\n{url}\n")
                
        with open("hebei_telecom.txt", "w", encoding="utf-8") as f:
            for name, url in valid_channels:
                f.write(f"{name},{url}\n")
                
        print(f"工作圆满完成！已自动更新IP并补全全部真实组播源，共生成 {len(valid_channels)} 个连接。")
        '

    - name: 自动把新文件提交存回仓库
      run: |
        git config --global user.name "actions-user"
        git config --global user.email "action@github.com"
        git add .
        git commit -m "自动更新动态中转IP并锁定真实河北电信组播端口" || exit 0
        git push
