name: 自动扫描并测速直播源

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检查并下载仓库代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 在服务器安装谷歌浏览器 (Selenium必备)
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: 安装全部核心依赖与网络并发组件
      run: |
        python -m pip install --upgrade pip
        pip install requests[socks] futures selenium eventlet lxml

    - name: 执行基础抓取与合并脚本
      run: |
        python itv_all.py || python a.py

    - name: 定向过滤并同时生成M3U与TXT格式河北电信组播
      run: |
        python -c '
        import os
        import re
        
        target_files = ["itvlist.m3u", "itvlist.txt", "itv_results.txt", "itv_speed.txt"]
        hebei_m3u_lines = []
        hebei_txt_lines = []
        
        # 提取并过滤包含"河北"或"电信"特征的频道
        for fname in target_files:
            if os.path.exists(fname):
                with open(fname, "r", encoding="utf-8", errors="ignore") as f:
                    lines = f.readlines()
                
                for i, line in enumerate(lines):
                    # 如果包含河北、hebei特征
                    if "河北" in line or "hebei" in line.lower():
                        # 处理 M3U 格式的提取
                        if line.startswith("#EXTINF") and i+1 < len(lines):
                            channel_url = lines[i+1].strip()
                            if channel_url.startswith("http") or channel_url.startswith("rtp"):
                                hebei_m3u_lines.append(line)
                                hebei_m3u_lines.append(lines[i+1])
                                
                                # 同时将其转换为 TXT 格式 (频道名,直播源地址)
                                # 提取 #EXTINF 中的电视名称
                                name_match = re.search(r",([^,\n\r]+)$", line)
                                channel_name = name_match.group(1).strip() if name_match else "河北电信频道"
                                hebei_txt_lines.append(f"{channel_name},{channel_url}\n")
                        
                        # 如果原本的文件已经是 TXT 格式 (例如 频道名,http://...)
                        elif "," in line and not line.startswith("#"):
                            parts = line.split(",")
                            if len(parts) >= 2:
                                c_name = parts[0].strip()
                                c_url = parts[1].strip()
                                if c_url.startswith("http") or c_url.startswith("rtp"):
                                    hebei_txt_lines.append(f"{c_name},{c_url}\n")
                                    hebei_m3u_lines.append(f"#EXTINF:-1,{c_name}\n")
                                    hebei_m3u_lines.append(f"{c_url}\n")
        
        # 去重处理
        final_m3u = []
        seen_urls = set()
        for i in range(0, len(hebei_m3u_lines), 2):
            if i+1 < len(hebei_m3u_lines):
                inf = hebei_m3u_lines[i]
                url = hebei_m3u_lines[i+1]
                if url not in seen_urls:
                    seen_urls.add(url)
                    final_m3u.extend([inf, url])
        
        final_txt = list(set(hebei_txt_lines))
        
        # 1. 写入 hebei_telecom.m3u
        if final_m3u:
            with open("hebei_telecom.m3u", "w", encoding="utf-8") as f:
                f.write("#EXTM3U\n")
                f.writelines(final_m3u)
            print("成功生成 hebei_telecom.m3u 文件！")
            
        # 2. 写入 hebei_telecom.txt
        if final_txt:
            with open("hebei_telecom.txt", "w", encoding="utf-8") as f:
                f.writelines(final_txt)
            print("成功生成 hebei_telecom.txt 文件！")
            
        if not final_m3u and not final_txt:
            print("本次扫描未过滤到符合条件的河北电信组播源。")
        '

    - name: 自动把新文件提交存回仓库
      run: |
        git config --global user.name "actions-user"
        git config --global user.email "action@github.com"
        git add .
        git commit -m "自动更新河北电信组播源(M3U和TXT)" || exit 0
        git push                        # 如果原本的文件已经是 TXT 格式 (例如 频道名,http://...)
                        elif "," in line and not line.startswith("#"):
