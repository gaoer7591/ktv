name: 自动扫描并测速直播源

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检查并下载仓库代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装项目测速全部核心依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests[socks] futures

    - name: 执行抓取与合并脚本
      run: |
        python itv_all.py || python a.py

    - name: 自动把测速生成的新文件提交存回仓库
      run: |
        git config --global user.name "actions-user"
        git config --global user.email "action@github.com"
        git add .
        git commit -m "自动更新直播源成功" || exit 0
        git push
